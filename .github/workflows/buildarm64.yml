name: Auto Build function (Use for call only)
on:
  workflow_call:
    inputs:
      arch:
        type: string
      gapps:
        type: string
      root:
        type: string
      insider:
        type: string
      magiskver:
        type: string
      devicemodel:
        type: string
      amazonflag:
        type: string
      compressformat:
        type: string
      wsa_ver:
        type: string
      gappsver:
        type: string
      release_type:
        type: string

jobs:
  build:
    name: Build WSA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ♻️
        uses: actions/checkout@v7

      - name: Setup Python 🏭
        uses: actions/setup-python@v6
        with:
          check-latest: true
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: MagiskOnWSA/scripts/

      - name: Setup Python3 Virtual Enviroment 🐍
        working-directory: MagiskOnWSA/scripts
        run: |
          sudo apt-get update
          PYTHON_VENV_DIR="$(dirname "$PWD")/python3-env"
          python3 -m venv "$PYTHON_VENV_DIR" || abort "Failed to create python3 virtual env"
          # shellcheck disable=SC1091
          source "$PYTHON_VENV_DIR/bin/activate" || abort "Failed to activate python3 virtual env"
          python3 -c "import pkg_resources; pkg_resources.require(open('requirements.txt',mode='r'))" &>/dev/null || {
              echo "Installing Python3 dependencies"
              python3 -m pip install --upgrade -r requirements.txt || abort "Failed to install python3 dependencies"
          }
          deactivate

      - name: Install Ubuntu Dependencies 🧑‍🏭
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: e2fsprogs attr unzip qemu-utils python3-venv
          version: 1.0

      - name: Build WSA ${{ inputs.arch }} with GApps ${{ inputs.root }} 🏗️
        id: wsa
        working-directory: MagiskOnWSA
        run: |
          chmod -R 777 ./
          mkdir -p download
          ./scripts/build.sh --arch ${{ inputs.arch }} --release-type ${{ inputs.release_type }} --magisk-ver ${{ inputs.magiskver }} ${{ inputs.gapps }} --root-sol ${{ inputs.root }} ${{ inputs.amazonflag }} --compress-format none

      - name: Apply Custom Device Model 📱
        if: inputs.devicemodel != 'none' && inputs.devicemodel != ''
        working-directory: MagiskOnWSA
        run: |
          chmod +x ./scripts/apply_custom_model.sh
          ./scripts/apply_custom_model.sh "${{ steps.wsa.outputs.artifact_folder }}" "${{ inputs.devicemodel }}"
        shell: bash

      - name: Prepare release tag 🏷️
        id: releasetag
        run: |
          currentver="${{ inputs.wsa_ver }}"
          {
            echo "WSA_TAG=Windows_11_${currentver}_arm64"
            echo "WSA_VER=${currentver}"
          } >> "$GITHUB_ENV"

      - name: Pass to Windows 💸
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.wsa.outputs.artifact }}-${{ steps.wsa.outputs.built }}
          path: MagiskOnWSA/output

    outputs:
      zipname: ${{ steps.wsa.outputs.artifact }}
      artifact_folder: ${{ steps.wsa.outputs.artifact_folder }}
      built: ${{ steps.wsa.outputs.built }}
      tag: ${{ env.WSA_TAG }}
      wsaver: ${{ env.WSA_VER }}

  make-pri:
    name: Merge PRI resources
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout ♻️
        uses: actions/checkout@v7

      - name: Download built artifact ⌛
        uses: actions/download-artifact@v8
        with:
          path: output
          name: ${{ needs.build.outputs.zipname }}-${{ needs.build.outputs.built }}

      - name: Remove unused artifact ❌
        uses: geekyeggo/delete-artifact@v6
        with:
          name: ${{ needs.build.outputs.zipname }}-${{ needs.build.outputs.built }}

      - name: Copy makepri.exe for arm64 🧙🏻‍♂️
        shell: pwsh
        run: |
          $makepri = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "makepri.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.DirectoryName -match '\\arm64\\' } |
              Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $makepri) { throw "makepri.exe (arm64) not found under Windows Kits" }
          Copy-Item -Force $makepri.FullName "${{ github.workspace }}\output\${{ needs.build.outputs.artifact_folder }}"

      - name: Compact Images 💿
        shell: pwsh
        run: |
          foreach ($Partition in 'system','product','system_ext','vendor') {
              Write-Output "Optimizing of $Partition..."
              Write-Output "SELECT VDISK FILE=`"${{ github.workspace }}\output\${{ needs.build.outputs.artifact_folder }}\$Partition.vhdx`"`nATTACH VDISK READONLY`nCOMPACT VDISK`nDETACH VDISK" | Set-Content -Path "$Partition.txt" -Encoding Ascii
              Start-Process -NoNewWindow -Wait "diskpart.exe" -Args "/s $Partition.txt" -RedirectStandardOutput NUL
          }

      - name: Compress artifact for Windows 11 arm64 Build📦
        shell: pwsh
        working-directory: output
        run: 7z a -t7z -mx=6 -m0=LZMA2 -ms=on -mmt=8 -- "${{ needs.build.outputs.zipname }}.7z" ${{ needs.build.outputs.artifact_folder }}\*

      - name: Generate SHA-256 checksums ✔️
        shell: pwsh
        working-directory: output
        run: |
          Get-ChildItem -Path . -Filter *.7z | ForEach-Object {
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
          } | Out-File -FilePath sha256-checksum.txt -Encoding utf8

      - name: Upload Windows 11 arm64 build to release 🤌
        uses: softprops/action-gh-release@v3
        with:
          files: |
            output/${{ needs.build.outputs.zipname }}.7z
            output/sha256-checksum.txt
          fail_on_unmatched_files: true
          append_body: false
          tag_name: ${{ needs.build.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
