# =============================================================================
# update.yml — WSABuilds automated update & release dispatch
#
# Triggered manually (workflow_dispatch) or via the GitHub UI.
# Checks for new WSA retail versions and component updates, then dispatches
# a single build:  WSA x64  |  Magisk Stable  |  OpenGApps Pico
#
# Inputs:
#   wsa_ver      (optional) Override the WSA version to build.
#                           Leave empty to auto-detect the latest retail release.
#   wsa_message  (required) Human-readable release note, e.g. "2311.40000.4.0"
#   release_type (choice)   Must be "retail" — other values are rejected.
# =============================================================================

name: Check update & build

on:
  workflow_dispatch:
    inputs:
      wsa_ver:
        type: string
        description: >
          WSA version to build (optional).
          Leave empty to auto-detect the latest retail release.
        required: false

      wsa_message:
        type: string
        description: Human-readable release note (e.g. "2311.40000.4.0 — December update")
        required: true

      release_type:
        type: choice
        description: Release channel — only "retail" (stable) is supported.
        required: true
        default: retail
        options:
          - retail

# =============================================================================
# Jobs
# =============================================================================

jobs:

  # ---------------------------------------------------------------------------
  # check — verify component versions and decide whether a build is needed
  # ---------------------------------------------------------------------------
  check:
    name: Check component versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ♻️
        uses: actions/checkout@v4

      - name: Install Python dependencies 🐍
        run: pip3 install --quiet beautifulsoup4 lxml requests packaging

      # Check Magisk stable version — outputs MAGISK_STABLE_MSG env var
      - name: Check Magisk Stable version ✅
        run: |
          wget -q https://github.com/MustardChef/WSABuilds/raw/master/MagiskOnWSA/Update%20Check/MagiskStableUpdateCheck.py
          python3 MagiskStableUpdateCheck.py

      # Check OpenGApps Pico version — we query the opengapps/x86_64 releases
      - name: Check OpenGApps Pico version ☑️
        run: |
          echo "Checking latest OpenGApps Pico (x86_64 / Android 13) …"
          LATEST=$(curl -s \
            "https://api.github.com/repos/opengapps/x86_64/releases/latest" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            | python3 -c "
          import json, sys, re
          data = json.load(sys.stdin)
          tag = data.get('tag_name', '')
          assets = [a['name'] for a in data.get('assets', [])
                    if re.search(r'pico.*13\.0.*x86_64|x86_64.*13\.0.*pico', a['name'], re.I)]
          print(f'OPENGAPPS_PICO_TAG={tag}')
          print(f'OPENGAPPS_PICO_ASSET={assets[0] if assets else \"\"}')
          ")
          echo "$LATEST" >> "$GITHUB_ENV"
          echo "OpenGApps Pico info:"
          echo "$LATEST"

      # Check WSA retail version — outputs RETAIL_UPDATE + LATEST_RETAIL_VER
      - name: Check WSA Retail version ☑️
        run: |
          wget -q https://github.com/MustardChef/WSABuilds/raw/master/MagiskOnWSA/Update%20Check/WSARetailUpdateCheck.py
          # WSARetailUpdateCheck.py clones the MagiskOnWSALocal xml/ dir;
          # supply it the path to our local copy.
          python3 WSARetailUpdateCheck.py
        env:
          WSA_XML_DIR: ${{ github.workspace }}/MagiskOnWSA/xml

      - name: Summarise component versions 📋
        run: |
          echo "Magisk Stable  : ${{ env.MAGISK_STABLE_MSG }}"
          echo "OpenGApps Pico : ${{ env.OPENGAPPS_PICO_TAG }}"
          echo "WSA Retail     : ${{ env.LATEST_RETAIL_VER }}"
          echo "WSA update?    : ${{ env.RETAIL_UPDATE }}"

    outputs:
      MAGISK_STABLE_MSG:  ${{ env.MAGISK_STABLE_MSG }}
      OPENGAPPS_PICO_TAG: ${{ env.OPENGAPPS_PICO_TAG }}
      RETAIL_UPDATE:      ${{ env.RETAIL_UPDATE }}
      LATEST_RETAIL_VER:  ${{ env.LATEST_RETAIL_VER }}

  # ---------------------------------------------------------------------------
  # update-downloadlinks — update README badges / download links table
  # ---------------------------------------------------------------------------
  update-downloadlinks:
    name: Update README download links
    runs-on: ubuntu-latest
    needs: [check]
    # Run when either the caller supplied an explicit version OR a new WSA
    # retail version was detected.
    if: inputs.wsa_ver != '' || needs.check.outputs.RETAIL_UPDATE == 'yes'

    steps:
      - name: Checkout 🔄
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install --quiet beautifulsoup4 PyGithub lxml

      - name: Resolve WSA version and compose badge links
        run: |
          ver="${{ inputs.wsa_ver || needs.check.outputs.LATEST_RETAIL_VER }}"
          # Windows 11 x64 stable badge (blue)
          win11x64='<p><a href="https://github.com/MustardChef/WSABuilds/releases/tag/Windows_11_'"${ver}"'"><img alt="win11x64downstable" src="https://img.shields.io/badge/Download%20Latest%20Stable%20Build-Windows%2011%20x64-blue?style=for-the-badge&amp;logo=windows11"/></a></p>'
          {
            echo "LINK_FOR_W11X64=${win11x64}"
            echo "LATEST_VER=${ver}"
          } >> "$GITHUB_ENV"

      - name: Replace download link in README.md
        run: python "./MagiskOnWSA/Update Check/update-downloadlinks.py"
        env:
          LINK_FOR_W11X64: ${{ env.LINK_FOR_W11X64 }}
          RELEASE_TYPE: retail
          LATEST_VER:   ${{ env.LATEST_VER }}

      - name: Commit and push if changed
        run: |
          git diff --quiet && { echo "No changes to README.md"; exit 0; }
          git config --global user.email "68516357+MustardChef@users.noreply.github.com"
          git config --global user.name  "MustardChef"
          git commit -am "Update download link for WSA ${{ env.LATEST_VER }}"
          git pull --rebase origin master
          git push

  # ---------------------------------------------------------------------------
  # check-and-create-tag — create the GitHub release tag & empty release shell
  # ---------------------------------------------------------------------------
  check-and-create-tag:
    name: Create release tag and shell
    runs-on: ubuntu-latest
    needs: [check, update-downloadlinks]
    if: inputs.wsa_ver != '' || needs.check.outputs.RETAIL_UPDATE == 'yes'

    steps:
      - name: Checkout 🔄
        uses: actions/checkout@v4

      - name: Resolve WSA version
        run: |
          ver="${{ inputs.wsa_ver || needs.check.outputs.LATEST_RETAIL_VER }}"
          {
            echo "WSA_VER=${ver}"
            echo "WIN11X64_TAG=Windows_11_${ver}"
          } >> "$GITHUB_ENV"

      # Abort if the tag already exists — prevents duplicate releases
      - name: Check if Windows 11 x64 tag exists
        uses: mukunku/tag-exists-action@v1.6.0
        id: check-tag
        with:
          tag:  ${{ env.WIN11X64_TAG }}
          repo: "MustardChef/WSABuilds"

      - name: Stop if tag already exists
        if: steps.check-tag.outputs.exists == 'true'
        run: |
          echo "Tag ${{ env.WIN11X64_TAG }} already exists — nothing to do."
          exit 1

      # Download the Windows 11 x64 retail release notes template
      - name: Download release notes template 📥
        run: |
          wget -q \
            https://gist.github.com/MustardChef/788d12344916043a7a3df9c1165b8843/raw/a8084d98b28cf650a60c74f3abf0484640bd36b7/Windows11x64retail.md \
            -O Windows11x64.md

      # Substitute template placeholders
      - name: Fill in release notes ✏️
        shell: python
        env:
          GITHUB_WORKSPACE:     ${{ github.workspace }}
          MAGISK_STABLE_MSG:    ${{ needs.check.outputs.MAGISK_STABLE_MSG }}
          OPENGAPPS_PICO_TAG:   ${{ needs.check.outputs.OPENGAPPS_PICO_TAG }}
        run: |
          import os, re
          from datetime import datetime, timezone

          now  = datetime.now(timezone.utc)
          date = now.strftime("%d/%m/%Y")
          time = now.strftime("%H:%M:%S UTC")

          path = os.path.join(os.environ["GITHUB_WORKSPACE"], "Windows11x64.md")
          with open(path) as f:
              text = f.read()

          substitutions = {
              "<<DATEOF RELEASE>>":      date,
              "<<TIMEOF RELEASE>>":      time,
              "<<REASONFOR RELEASE>>":   "Scheduled update",
              "<<WSA ANDROID VERSION>>": "Android 13",
              "<<MAGISK STABLE VER>>":   os.environ.get("MAGISK_STABLE_MSG", ""),
              "<<GAPPS VARIANT>>":       "OpenGApps Pico",
              "<<GAPPS TAG>>":           os.environ.get("OPENGAPPS_PICO_TAG", ""),
          }
          for placeholder, value in substitutions.items():
              text = text.replace(placeholder, value)

          # Also handle the older << >> style used in some templates
          text = re.sub(r"<<DATEOFRELEASE>>",   date,                              text)
          text = re.sub(r"<<TIMEOFRELEASE>>",   time,                              text)
          text = re.sub(r"<<REASONFORRELEASE>>","Scheduled update",                text)
          text = re.sub(r"<<WSAANDROIDVERSION>>","Android 13",                     text)
          text = re.sub(r"<<MAGISKSTABLEVERSION>>",
                        os.environ.get("MAGISK_STABLE_MSG", "").replace("\\", ""), text)

          with open(path, "w") as f:
              f.write(text)
          print("Release notes updated.")

      - name: Create GitHub release tag & empty release shell ✍🏼
        uses: softprops/action-gh-release@v2
        with:
          tag_name:  ${{ env.WIN11X64_TAG }}
          name:      "Windows Subsystem For Android ${{ inputs.wsa_message }} for Windows 11 x64"
          body_path: ${{ github.workspace }}/Windows11x64.md
          token:     ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # build-retail-x64 — dispatch the single focused build
  # ---------------------------------------------------------------------------
  build-retail-x64:
    name: Build — WSA x64 Magisk Stable + Pico GApps (Retail)
    runs-on: ubuntu-latest       # orchestration only; actual build is in build.yml
    permissions: write-all
    needs: [check, check-and-create-tag, update-downloadlinks]
    if: inputs.wsa_ver != '' || needs.check.outputs.RETAIL_UPDATE == 'yes'

    uses: ./.github/workflows/build.yml
    with:
      wsa_ver:     ${{ inputs.wsa_ver || needs.check.outputs.LATEST_RETAIL_VER }}
      wsa_message: ${{ inputs.wsa_message }}
    secrets: inherit
